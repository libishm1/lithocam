name: ci
on: [push, pull_request]
jobs:
  cpp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.9", extras: "test"}              # Rhino 8's Python: mapping only (no 3.9 build on newer runners)
          - {os: ubuntu-latest, python: "3.12", extras: "test,features,ruled,robot"}   # quiddity, OCP, Tesseract
          - {os: windows-latest, python: "3.12", extras: "test,features,ruled,robot"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "python[${{ matrix.extras }}]"
      - run: pytest -rs python
  bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nanobind
      - run: cmake -S bindings -B build_py -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python' }}
      - run: cmake --build build_py --config Release
      - name: test (the module lands in build_py/Release on Windows, build_py elsewhere)
        shell: bash
        run: python bindings/test_bindings.py "$(dirname "$(find build_py -name '_lithocam*' \( -name '*.pyd' -o -name '*.so' \) | head -1)")"
      - name: studio tests (kinematics, CAM generators, program expansion, posts) on the built core
        shell: bash
        run: |
          pip install numpy pytest
          LITHOCAM_CORE="$(dirname "$(find build_py -name '_lithocam*' \( -name '*.pyd' -o -name '*.so' \) | head -1)")" \
            PYTHONPATH=python/src pytest -rs python/tests/test_studio_kinematics.py python/tests/test_studio_program.py
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: No sorry
        run: "! grep -rnw --include=*.lean -e sorry Lithocam"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
