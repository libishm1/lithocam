[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lithocam"
version = "0.0.1"
description = "Verified CAM building blocks for stone: kerf, scallop, and stone feature input from quiddity"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
# quiddity's wheel needs Python 3.11+. On older Pythons (Rhino 8) point LITHOCAM_QUIDDITY at the quiddity executable.
features = ["quiddity>=0.4.9; python_version >= '3.11'"]
test = ["pytest>=7"]
# lithocam.ruled reads B-reps with OpenCascade (OCP bindings, Apache-2.0; OCCT is LGPL-2.1 with exception).
ruled = ["cadquery-ocp>=7.7"]
# lithocam.robot: robot cells (cells/) in Tesseract.
robot = ["tesseract-robotics>=0.35", "numpy"]
# lithocam.meshsim: mesh stock removal with Manifold (Apache-2.0); needs `ruled` too.
mesh = ["manifold3d>=3.0", "numpy"]
# lithocam studio (Qt for Python, LGPL-3.0). Needs the _lithocam core from bindings/.
studio = ["PySide6>=6.6", "numpy"]

[project.scripts]
lithocam-features = "lithocam.features:main"

[project.gui-scripts]
lithocam-studio = "lithocam.studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
